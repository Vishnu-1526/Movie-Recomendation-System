<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Matchmaker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="bg-shape bg-shape-one" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-two" aria-hidden="true"></div>

  <main class="page">
    <section class="hero reveal">
      <p class="kicker">AI Movie Recommender</p>
      <h1>Find Your Next Favorite Film</h1>
      <p class="subtitle">
        Type a movie you like and get recommendations from the similarity model.
      </p>
    </section>

    <section class="panel reveal delay-1">
      <form id="recommend-form" autocomplete="off">
        <label for="movie-input">Movie title</label>
        <div class="input-wrap">
          <input
            id="movie-input"
            name="movie"
            type="text"
            placeholder="Try: Interstellar"
            required
          />
          <button type="submit">Recommend</button>
        </div>
        <ul id="suggestions" class="suggestions" role="listbox" aria-label="Title suggestions"></ul>
      </form>
    </section>

    <section id="result-panel" class="panel result reveal delay-2" hidden>
      <h2 id="result-title"></h2>
      <ul id="result-list"></ul>
    </section>

    <section id="error-panel" class="panel error reveal delay-2" hidden></section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
